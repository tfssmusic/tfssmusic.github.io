<!DOCTYPE HTML>
<html lang="en-US">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Music Home</title>
		
		<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@1,300..700&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono" rel="stylesheet">
		
		<link href="main.css" rel="stylesheet">
		<link href="regscreen.css" rel="stylesheet">
		<link href="smallscreen.css" rel="stylesheet">
	</head>
	<body>
		<div class="defaultnav">
			<div class="inactive displaypostload">
				<header>
					<a href="https://tfssmusic.github.io/">
						<img width=60vw src="assets/tfssmusiclogo.png" alt="logoicon" class="headimg preventselect">
					</a>
					<div class="grad"></div>
				</header>
				<nav>
					<div class="grad flip" style="bottom:5.25rem"></div>
					<a href="#About-Us" class="nava">ABOUT US</a>
					<a href="#Links" class="nava">LINKS</a>
					<a href="#Upcoming" class="nava">UPCOMING</a>
					<a href="#FAQ" class="nava">FAQ</a>
					<a href="#Archives" class="nava">ARCHIVES</a>
					<a href="#Contact" class="nava">CONTACT</a>
				</nav>
				<p class="credit" style="opacity:0;animation: fadeIn 2s forwards;animation-delay:3s;">Design by <a style="color:#999;text-decoration:underline;" href="https://github.com/jasonxwxia/">Jason Xia</a>. (c) 2025 Turner Fenton Music Council</p>
			</div>
			<div class="active displaypreload">
				<header>
					<span style="opacity:0">
						<img width=60vw src="assets/tfssmusiclogo.png" class="headimg preventselect">	
					</span>
					<div class="grad"></div>
				</header>
				<nav>
					<div class="grad flip" style="bottom:5.25rem"></div>
					<p class="nava"></p>
				</nav>
				<p class="credit" style="opacity:0"></p>
			</div>
		</div>
		<div class="mobilenav">
			<header>
				<a href="https://tfssmusic.github.io/">
					<img width=48 src="assets/tfssmusiclogo.png" alt="logoicon" class="headimg">
				</a>
				<div class="grad"></div>
			</header>
		</div>
		<div class="displaypostload inactive">
			<div class="content bg preventselect" style="left:0;justify-content:end;bottom:4.55rem;">
				<div class="imgwrap" style="transform:translateY(8px);">
					<img src="assets/sbg2.png" style="max-width:100%;">
					<div class="mask"></div>
				</div>
				<div class="imgwrap">
					<img src="assets/floor.png" style="max-width:100%;">
					<div class="mask2"></div>
				</div>
			</div>
		</div>
		<div class="displaypreload active">
			<div class="content bg preventselect" style="left:0;justify-content:end;bottom:4.55rem;">
				<div style="z-index:2;width:100vw;height:100vh;background-color:rgba(0,0,0,0.50);position:absolute;top:0;left:0;"></div>
				<div class="imgwrap" style="transform:translateY(8px);">
					<img src="assets/sbg2.png" style="max-width:100%;">
				</div>
				<div class="imgwrap">
					<img src="assets/floor.png" style="max-width:100%;">
				</div>
			</div>
		</div>
		<div>
			<div id="maincontent" class="inactive1"> 
				<div class="inactive displaypostload">
					<div class="content scrollcontent" id="visible" style="color:white">
						<div class="contentbg" style="background: #E8E1D9; transform: rotate(7deg) translateX(-5vw);"></div>
						<div class="contentbg"></div>
					</div>
				</div>
				<div class="content scrollcontent" style="color:white;transform:translateX(calc(-50% + 100vw))">
					Links
				</div>
				<div class="content scrollcontent" style="color:white;transform:translateX(calc(-50% + 100vw))">
					Upcoming
				</div>
				<div class="content scrollcontent" style="color:white;transform:translateX(calc(-50% + 100vw))">
					FAQ	
				</div>
				<div class="content scrollcontent" style="color:white;transform:translateX(calc(-50% + 100vw))">
					Archives
				</div>
				<div class="content scrollcontent" style="color:white;transform:translateX(calc(-50% + 100vw))">
					Contact
				</div>
			</div>
			<footer></footer>

			<p class="hiddencontent" id="About-Us">a</p>
			<p class="hiddencontent" id="Links">b</p>
			<p class="hiddencontent" id="Upcoming">c</p>
			<p class="hiddencontent" id="FAQ">d</p>
			<p class="hiddencontent" id="Archives">e</p>
			<p class="hiddencontent" id="Contact">f</p>
		</div>
		<script src="scrollscript.js"></script>
		<script src="spotlight.js"></script>
		<script src="delayload.js"></script>

		<script>
		history.scrollRestoration = "manual";
		</script>
	</body>
</html>
